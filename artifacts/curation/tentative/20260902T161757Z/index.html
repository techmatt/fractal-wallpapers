 3, [], \"0.14806778621969643\", \"0.814074506861822\", \"0.003948072678619907\"]", "picture": "artifacts/curation/depth/overnight_b_pilot/pictures/458f9abee0c0a2ce.jpg", "src": "../../depth/overnight_b_pilot/pictures/458f9abee0c0a2ce.jpg"}, {"schema": 1, "seat": 739, "key": "8a8ee96bf55a9476", "alias": "8a8ee96b", "mode": "exp_smoothing", "partition": "multibrot4", "cell": "light_vivid_magenta", "hue_family": "magenta", "cells": ["light_vivid_magenta", "light_muted_magenta"], "families": ["magenta"], "centered": true, "rank": 0.147092, "p_ge4": 0.530975, "location": "[\"multibrot4\", 4, [], \"0.44637845358512157\", \"0.6581791951048298\", \"0.0000037687148461993266\"]", "picture": "artifacts/curation/depth/overnight_a_main/pictures/8a8ee96bf55a9476.jpg", "src": "../../depth/overnight_a_main/pictures/8a8ee96bf55a9476.jpg"}, {"schema": 1, "seat": 740, "key": "2a0f6d9f8b7e4d22", "alias": "2a0f6d9f", "mode": "direct_trap_multiply", "partition": "julia:multibrot4", "cell": "dark_muted_yellow", "hue_family": "yellow", "cells": ["dark_muted_yellow", "dark_muted_orange"], "families": ["yellow", "orange"], "centered": false, "rank": 0.141956, "p_ge4": 0.520559, "location": "[\"julia:multibrot4\", 4, [[\"-0.7942531287539514\", \"-0.05709481193651713\"]], \"-1.0852957115024446\", \"-0.021922885277582977\", \"0.2555462279730733\"]", "picture": "artifacts/curation/depth/overnight_b_main/pictures/2a0f6d9f8b7e4d22.jpg", "src": "../../depth/overnight_b_main/pictures/2a0f6d9f8b7e4d22.jpg"}, {"schema": 1, "seat": 741, "key": "2626871df08dda85", "alias": "2626871d", "mode": "tia", "partition": "multibrot5", "cell": "light_muted_rose", "hue_family": "rose", "cells": ["light_muted_rose", "dark_muted_rose"], "families": ["rose"], "centered": false, "rank": 0.139217, "p_ge4": 0.651217, "location": "[\"multibrot5\", 5, [], \"0.4334313393198413\", \"0.665272816434966\", \"0.00009793280292721335\"]", "picture": "artifacts/curation/depth/dc2/pictures/2626871df08dda85.jpg", "src": "../../depth/dc2/pictures/2626871df08dda85.jpg"}, {"schema": 1, "seat": 742, "key": "f63532167cc3c20d", "alias": "f6353216", "mode": "smooth", "partition": "multibrot5", "cell": "light_muted_yellow", "hue_family": "yellow", "cells": ["light_muted_yellow", "dark_vivid_yellow"], "families": ["yellow"], "centered": false, "rank": 0.138719, "p_ge4": 0.530097, "location": "[\"multibrot5\", 5, [], \"0.24237168898486547\", \"0.696654827391534\", \"0.000013385203413330359\"]", "picture": "artifacts/curation/mine/mine1/pictures/f63532167cc3c20d.jpg", "src": "../../mine/mine1/pictures/f63532167cc3c20d.jpg"}, {"schema": 1, "seat": 743, "key": "8241f205d71afa4e", "alias": "8241f205", "mode": "direct_trap_multiply", "partition": "julia:multibrot3", "cell": "dark_muted_green", "hue_family": "green", "cells": ["dark_muted_green", "dark_muted_lime"], "families": ["green"], "centered": false, "rank": 0.137779, "p_ge4": 0.552548, "location": "[\"julia:multibrot3\", 3, [[\"0.4169190761394084\", \"0.006933824661843332\"]], \"0.241445298361125\", \"-0.6009932805920934\", \"0.20202707499381115\"]", "picture": "artifacts/curation/depth/overnight_b_main/pictures/8241f205d71afa4e.jpg", "src": "../../depth/overnight_b_main/pictures/8241f205d71afa4e.jpg"}, {"schema": 1, "seat": 744, "key": "0fa5c7e55caedd27", "alias": "0fa5c7e5", "mode": "tia", "partition": "julia:mandelbrot", "cell": "light_muted_magenta", "hue_family": "azure", "cells": ["light_muted_magenta"], "families": ["azure"], "centered": false, "rank": 0.135993, "p_ge4": 0.652851, "location": "[\"julia:mandelbrot\", 2, [[\"0.22910499903009596\", \"0.5497423506741674\"]], \"-0.4921657482495278\", \"0.5231499885814621\", \"0.02675783012645512\"]", "picture": "artifacts/curation/depth/dc2/pictures/0fa5c7e55caedd27.jpg", "src": "../../depth/dc2/pictures/0fa5c7e55caedd27.jpg"}, {"schema": 1, "seat": 745, "key": "127b56bfc7641245", "alias": "127b56bf", "mode": "direct_trap_multiply", "partition": "julia:multibrot3", "cell": "dark_muted_rose", "hue_family": "rose", "cells": ["dark_muted_rose", "dark_muted_red"], "families": ["rose"], "centered": false, "rank": 0.064766, "p_ge4": 0.533813, "location": "[\"julia:multibrot3\", 3, [[\"0.4169190761394084\", \"0.006933824661843332\"]], \"-0.5889669639283558\", \"-0.0115884903227825\", \"0.011371011507412694\"]", "picture": "artifacts/curation/depth/overnight_b_main/pictures/127b56bfc7641245.jpg", "src": "../../depth/overnight_b_main/pictures/127b56bfc7641245.jpg"}];
const FACETS = ["mode", "hue_family", "cell", "partition", "centered"];
// `cells` and `families` are lists because dominance is thresholded: a picture
// can be dominant in several, and filtering on the leading one alone would hide
// a green picture from the green filter whenever teal happened to lead it.
const PLURAL = {hue_family: "families", cell: "cells"};
const NONE = "\u2014";
const picked = new Set();
const chosen = {};

function valuesOf(row, facet) {
  const many = PLURAL[facet];
  if (many && Array.isArray(row[many]) && row[many].length) return row[many].map(String);
  const one = row[facet];
  return [one === null || one === undefined ? NONE : String(one)];
}

for (const facet of FACETS) {
  const tally = new Map();
  for (const row of ROWS) {
    for (const value of valuesOf(row, facet)) tally.set(value, (tally.get(value) || 0) + 1);
  }
  const box = document.getElementById("f-" + facet);
  chosen[facet] = new Set();
  for (const [value, n] of [...tally].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.value = value;
    input.addEventListener("change", () => {
      if (input.checked) { chosen[facet].add(value); } else { chosen[facet].delete(value); }
      draw();
    });
    const count = document.createElement("b");
    count.textContent = n;
    label.append(input, document.createTextNode(value + " "), count);
    box.append(label);
  }
}

function matches(row) {
  for (const facet of FACETS) {
    const want = chosen[facet];
    if (want.size && !valuesOf(row, facet).some((value) => want.has(value))) return false;
  }
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (q && !row.key.toLowerCase().includes(q) && !row.alias.toLowerCase().includes(q)) {
    return false;
  }
  return true;
}

function flash(node, text) {
  const was = node.textContent;
  node.classList.add("flash");
  node.textContent = text;
  setTimeout(() => { node.classList.remove("flash"); node.textContent = was; }, 700);
}

// `navigator.clipboard` is undefined over `file://` in some browsers, so the page
// carries its own fallback rather than silently copying nothing.
function copy(text) {
  const fallback = () => {
    const box = document.createElement("textarea");
    box.value = text;
    document.body.append(box);
    box.select();
    try { document.execCommand("copy"); } finally { box.remove(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else {
    fallback();
  }
}

function tile(row) {
  const card = document.createElement("div");
  card.className = "tile" + (picked.has(row.key) ? " picked" : "");
  const pick = () => {
    if (picked.has(row.key)) { picked.delete(row.key); } else { picked.add(row.key); }
    card.classList.toggle("picked", picked.has(row.key));
    document.getElementById("picked").textContent = picked.size;
  };
  if (row.src) {
    const img = document.createElement("img");
    img.src = row.src;
    img.loading = "lazy";
    img.title = "click to select";
    img.addEventListener("error", () => {
      const gone = document.createElement("div");
      gone.className = "gone";
      gone.textContent = "no picture on this disk";
      img.replaceWith(gone);
      gone.addEventListener("click", pick);
    });
    img.addEventListener("click", pick);
    card.append(img);
  }
  const meta = document.createElement("div");
  meta.className = "meta";
  const top = document.createElement("div");
  top.className = "line";
  const alias = document.createElement("span");
  alias.className = "alias";
  alias.textContent = row.alias;
  alias.title = row.key + " \u2014 click to copy the full ID";
  alias.addEventListener("click", () => { copy(row.key); flash(alias, "copied"); });
  const score = document.createElement("span");
  score.className = "num dim";
  score.title = "rank key / P(\u22654)";
  score.textContent = (row.rank === null ? NONE : Number(row.rank).toFixed(3)) + " / " +
    (row.p_ge4 === null ? NONE : Number(row.p_ge4).toFixed(3));
  top.append(alias, score);
  const one = document.createElement("div");
  one.className = "dim";
  one.textContent = row.mode + " \u00b7 " + (row.hue_family || NONE) +
    " \u00b7 " + (row.cell || NONE);
  const two = document.createElement("div");
  two.className = "dim";
  two.textContent = row.partition + (row.centered ? " \u00b7 centered" : "") +
    " \u00b7 seat " + row.seat;
  meta.append(top, one, two);
  card.append(meta);
  return card;
}

function draw() {
  const held = ROWS.filter(matches);
  const key = document.getElementById("sort").value;
  held.sort((a, b) => key === "seat" ? a.seat - b.seat : (b[key] ?? -1) - (a[key] ?? -1));
  document.getElementById("grid").replaceChildren(...held.map(tile));
  document.getElementById("empty").hidden = held.length > 0;
  document.getElementById("count").textContent = held.length + " of " + ROWS.length + " shown";
  document.getElementById("picked").textContent = picked.size;
}

document.getElementById("q").addEventListener("input", draw);
document.getElementById("sort").addEventListener("change", draw);
document.getElementById("clear").addEventListener("click", () => {
  for (const facet of FACETS) chosen[facet].clear();
  for (const box of document.querySelectorAll("header input[type=checkbox]")) {
    box.checked = false;
  }
  document.getElementById("q").value = "";
  draw();
});
document.getElementById("copy").addEventListener("click", () => {
  const says = document.getElementById("says");
  if (!picked.size) { says.textContent = "nothing selected"; return; }
  const order = ROWS.filter((row) => picked.has(row.key)).map((row) => row.key);
  copy(order.join(" "));
  says.textContent = "copied " + order.length + " ID(s)";
  setTimeout(() => { says.textContent = ""; }, 1400);
});
document.getElementById("drop").addEventListener("click", () => { picked.clear(); draw(); });
draw();
</script>
