[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-wallpapers"
version = "0.1.0"
description = "ML-steered fractal wallpaper generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Matt Fisher" }]
# Arbitrary-precision arithmetic, for one job: solving for a minibrot nucleus.
# A nucleus at any interesting period sits at a scale where `f64` has no digits
# left to localize it with — the frame still renders in `f64`, but its center
# cannot be found there — and Newton needs accurate division, which the standard
# library's `decimal` gives without a complex type to use it through.
dependencies = ["mpmath>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Training and running the judges. Kept out of the base install on purpose: a
# clone that only wants to render fractals should not pull two gigabytes of CUDA
# wheels, and the whole engine, the discovery walk, the supply engine and the
# labeling rig work without any of this. `models` is what a machine that trains
# a head installs.
models = [
  "torch>=2.6",
  "torchvision>=0.21",
  "timm>=1.0.27",
  "numpy>=2",
  "pillow>=11",
]

# The CUDA build, not PyPI's CPU default: a head trains in an hour on a GPU and
# most of a week without one.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[project.scripts]
fractal-wallpapers = "fractal_wallpapers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

# The labeling rig's page is an asset of the package that serves it, not a
# resource the server looks up on disk: an installed checkout has to be able to
# hand a browser the same page a working tree does.
[tool.setuptools.package-data]
"fractal_wallpapers.labeling" = ["page.html"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
