[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-wallpapers"
version = "0.1.0"
description = "ML-steered fractal wallpaper generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Matt Fisher" }]
# Arbitrary-precision arithmetic, for one job: solving for a minibrot nucleus.
# A nucleus at any interesting period sits at a scale where `f64` has no digits
# left to localize it with — the frame still renders in `f64`, but its center
# cannot be found there — and Newton needs accurate division, which the standard
# library's `decimal` gives without a complex type to use it through.
dependencies = ["mpmath>=1.3"]

[project.optional-dependencies]
# The suite and the linter, plus SciPy for one guard: `curate rank-key`'s IRLS is
# hand-written because `sklearn` is not in this project's dependency set, and a
# hand-written fit has to be checked against something that was not. Nothing this
# package ships imports SciPy any more — the MILP that did is retired.
#
# `numpy` and `pillow` are here because **the suite does not run without them**,
# which is a different question from what the package needs. 113 tests failed on
# `.[dev]` for want of `PIL` alone on 2026-09-15, and three modules imported it at
# module level and took the whole CI run down at collection — every `check` job
# since 2026-09-11 died in under four seconds without executing a test. numpy was
# already here by accident: `scipy` requires `numpy<2.8,>=2.0.0`, so the lane has
# always had it without `dev` ever saying so, and a dependency the suite relies on
# by accident is one that leaves when its supplier does.
#
# This does NOT put them in the package's own path. `pip install -e .` is
# unchanged and stays torch-free, `tests/test_base_install.py` proves it in a
# subprocess with these imports refused, and `cli.EXTRA_FOR` still names `solve`
# as the cheapest extra for a *user* who needs numpy or pillow — `dev` is the
# lane's install, not theirs. Pillow is about three megabytes against the hundreds
# of megabytes of torch in the `models` extra, which is why this is worth doing for
# `pillow` and is not worth doing for `torch`.
dev = ["pytest>=8", "ruff>=0.6", "scipy>=1.14", "numpy>=2", "pillow>=11"]
# Training and running the judges, on the CPU build of torch. Kept out of the base
# install on purpose: the whole engine, the discovery walk, the supply engine and
# the labeling rig work without any of this. Scoring runs fine on CPU; training
# a head does too, only slowly — which is what `cuda` below is for.
models = [
  "torch>=2.6",
  "torchvision>=0.21",
  "timm>=1.0.27",
  "numpy>=2",
  "pillow>=11",
]
# `models` on the CUDA build, for a machine with an NVIDIA card that trains heads:
# an hour on a GPU against most of a week without one. **Opt-in and never the
# default**, Matt's principle of 2026-09-25 — nothing heavy is installed unless
# someone asks for it, and the CUDA wheels are gigabytes. It is `models`'s list
# again rather than an addition to it because the two cannot be installed
# together (`[tool.uv] conflicts`): one environment holds one torch. Keep the two
# lists the same.
cuda = [
  "torch>=2.6",
  "torchvision>=0.21",
  "timm>=1.0.27",
  "numpy>=2",
  "pillow>=11",
]
# Choosing the gallery. `numpy` and `pillow` are what read the ledger's colours
# and the pixel clouds the diversity rule acts on, and that is the whole of it —
# there is NO SOLVER here any more. The exact MILP `curate solve` used to hand its
# program to was measured infeasible at n=1000 against a thirty-minute bar and is
# retired, and SciPy went with it. Its own extra and not part of `models`: the leg
# reads scores off a store and never loads a head, so a machine that chooses a
# gallery does not need torch, and a machine that only renders needs
# neither.
solve = [
  "numpy>=2",
  "pillow>=11",
]

# Which torch each of those two extras gets. uv reads this and pip does not (README,
# *Install*).
#
# **`models` is CPU on every platform.** Windows and macOS take PyPI's wheel,
# which is already the CPU build there (macOS's carries MPS, Apple silicon's GPU
# path). Linux does not: PyPI's Linux torch is the CUDA build and pulls about
# gigabytes of `nvidia-*` wheels with it, so Linux is sent to PyTorch's CPU
# index, which also serves aarch64.
#
# **`cuda` is cu124 on Windows and Linux x86_64**, the build every shipped head was
# trained on (`models/gallery_grade/README.md`'s *What a rebuild has to match*).
# That index has no macOS wheel and no Linux aarch64 wheel, so `cuda` falls back to
# PyPI there — MPS on a Mac, PyPI's own CUDA build on Linux ARM.
#
# Scoping a source by `extra` is how uv selects an index per extra, and it only
# forks the resolution for extras declared as conflicting — without the
# `conflicts` line, `models` resolves to cu124 as well. Checked with a universal
# `uv lock` on 2026-09-25: `models` gave `torch 2.14.0+cpu` on Linux and `2.14.0`
# elsewhere, `cuda` gave `2.6.0+cu124` on Windows and Linux x86_64.
[tool.uv]
conflicts = [[{ extra = "models" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "models", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu124", extra = "cuda", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "models", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu124", extra = "cuda", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[project.scripts]
fractal-wallpapers = "fractal_wallpapers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

# The labeling rig's page is an asset of the package that serves it, not a
# resource the server looks up on disk: an installed checkout has to be able to
# hand a browser the same page a working tree does. **Both** files, and the
# second one was missing here until 2026-09-04: `page.html` pulls
# `export_control.js` with a `<script src>` and `server.CONTROL` opens it off
# `__file__`, so a non-editable install served a page whose exports lost their
# naming — silently, because a `<script>` that 404s fails in the browser console
# and nowhere the rig can see. `tests/test_label_export.py` now holds every
# non-Python file in the package to being declared here, so the next asset
# anyone adds in any package is caught rather than remembered.
[tool.setuptools.package-data]
"fractal_wallpapers.labeling" = ["page.html", "export_control.js"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
