[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-wallpapers"
version = "0.1.0"
description = "ML-steered fractal wallpaper generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Matt Fisher" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fractal-wallpapers = "fractal_wallpapers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
