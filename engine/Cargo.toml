[package]
name = "fractal-engine"
version = "0.1.0"
edition = "2024"
# The floor is the deep kernel's: `perturbation` calls `f64::next_up`, stable since
# 1.86, and the engine takes it by default. Saying so here is what makes an old
# toolchain report a VERSION rather than a missing method or a feature: cargo
# refuses with "requires rustc 1.86 or newer, while the currently active rustc
# version is …". Nothing else raises it — the edition wants 1.85 and the thirty
# dependencies are pure Rust and older than this.
rust-version = "1.86"

[features]
# **`deep` draws `dv=` links**: `render-link` hands a deep view to the picture kernel in
# `../perturbation`, the same copy the website's Deep tab compiles to `perturb.wasm`.
# On by default, because a native engine that can read a deep link should draw it.
# The website's `engine-wasm` turns it off (`default-features = false`): the page runs
# that kernel as a module of its own, and `engine.wasm` gains nothing from a second copy.
default = ["deep"]
deep = ["dep:perturbation"]

[dependencies]
# Complex arithmetic for family parameters and viewport geometry. The iteration
# kernels unpack to bare f64 components, where the arithmetic reads plainly.
num-complex = "0.4"
# Row-level parallelism in field production and resampling. That is the whole of
# the concurrency story here: no work stealing by hand, no tiling, no gated paths.
rayon = "1"
# Two image formats, for two different jobs. PNG is what a render is: lossless,
# because the picture is the deliverable. JPEG is what a walk's steering
# thumbnails are: there are tens of thousands of them per run, they are looked at
# in bulk and thrown away, and lossless would cost eight times the disk for a
# difference nobody sees at 384 pixels wide.
png = "0.18"
jpeg-encoder = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The deep picture kernel, from this repository: fixed-point reference orbits and the
# perturbed delta loop below the `f64` floor. No dependencies of its own.
perturbation = { path = "../perturbation", optional = true }

[profile.release]
opt-level = 3

# The tests render. Four of them in `expand` put whole candidate frames through
# the structural gates, which is the engine doing its actual job, and at `dev`'s
# `opt-level = 0` those four were about a minute of the suite's seventy seconds.
# Optimizing the test profile costs twenty seconds of compilation once and takes
# `cargo test` from around a minute to about seven seconds. `debug-assertions`
# and overflow checks are untouched — this is a speed setting, not a strictness
# one — and `dev` stays at zero so `cargo build` is still a fast build.
[profile.test]
opt-level = 2
