name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format check
        run: cargo fmt --check
        working-directory: engine

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: engine

      - name: Build the engine
        run: cargo build --release
        working-directory: engine

      # The crate's own tests, which the Python suite cannot reach: the escape
      # loop's channels, the resample kernel, the walk's gates and its focus
      # finder. Run after the build so a compile failure is reported as one.
      - name: Test the engine
        run: cargo test --release
        working-directory: engine
