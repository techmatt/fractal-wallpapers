name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The engine first, and the full lane after it. Both orders ran green before
  # 2026-09-14 and only one of them proved anything: with `--slow` ahead of
  # `cargo build --release`, every engine-backed test skipped itself — the walk
  # tests look for a release binary and stand down without one — so a green badge
  # meant the suite had been collected, not that the renderer worked.
  #
  # Three platforms, because the claim is that a person can install and run this on
  # any of them, and the install is the README's: `uv sync` with all three extras.
  # That makes this job the torch one too. A separate `models` job used to prove
  # the judges on one OS with pip; it is folded in here, and the lean install it
  # left behind is still proved — by `tests/test_base_install.py`, in a
  # subprocess with torch, torchvision and timm refused, on every platform.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `macos-latest` is Apple silicon. Intel macOS is not in the matrix: PyPI
        # stopped shipping x86_64 macOS torch wheels, so the `models` extra has
        # nothing to install there (README, *Install*).
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # uv's own Python, so every platform runs the same minor version the README
      # asks for. No cache: the Linux and Windows torch wheels are the CUDA build
      # and a cache of them is bigger than what it saves.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format check
        run: cargo fmt --check
        working-directory: engine

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: engine

      # BEFORE the Python suite, which is the whole point of this ordering.
      - name: Build the engine
        run: cargo build --release
        working-directory: engine

      # The crate's own tests, which the Python suite cannot reach: the escape
      # loop's channels, the resample kernel, the walk's gates and its focus
      # finder. Run after the build so a compile failure is reported as one.
      - name: Test the engine
        run: cargo test --release
        working-directory: engine

      # Exactly the README's line. On Linux and Windows `[tool.uv.sources]` sends
      # torch to the cu124 index, which runs on a runner with no GPU as a CPU
      # torch; on macOS it comes from PyPI with the MPS backend.
      - name: Install the package and all three extras
        run: uv sync --extra dev --extra models --extra solve

      # `--no-sync` on every `uv run`: a bare one syncs to the project's default
      # set first, which names no extras.
      - name: Lint
        run: uv run --no-sync python -m ruff check .

      - name: Format check
        run: uv run --no-sync python -m ruff format --check .

      # The full lane. `--slow` is what CI and a pre-checkpoint run give: the
      # default run holds back the renders, the training loops and the store
      # sweeps, which is right for an edit-run loop and wrong for a gate. `-rs`
      # so a skip is NAMED: zero skips is the normal reading on a machine with a
      # warm render cache, and a lane that quietly stopped running a file is the
      # failure this whole arrangement exists to catch. Through the checkout's
      # `.venv`, which `conftest` insists on wherever one exists.
      - name: Test
        run: uv run --no-sync python -m pytest --slow -rs
