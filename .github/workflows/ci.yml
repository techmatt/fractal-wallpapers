name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The engine first, and the full lane after it. Both orders ran green before
  # 2026-09-14 and only one of them proved anything: with `--slow` ahead of
  # `cargo build --release`, every engine-backed test skipped itself — the walk
  # tests look for a release binary and stand down without one — so a green badge
  # meant the suite had been collected, not that the renderer worked.
  #
  # Three platforms, because the claim is that a person can install and run this on
  # any of them, and the install is the README's: `uv sync` with all three extras.
  # That makes this job the torch one too. A separate `models` job used to prove
  # the judges on one OS with pip; it is folded in here, and the lean install it
  # left behind is still proved — by `tests/test_base_install.py`, in a
  # subprocess with torch, torchvision and timm refused, on every platform.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `macos-latest` is Apple silicon. Intel macOS is not in the matrix: PyPI
        # stopped shipping x86_64 macOS torch wheels, so the `models` extra has
        # nothing to install there (README, *Requirements*).
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # uv's own Python, so every platform runs the same minor version the README
      # asks for. No cache: the torch wheels are hundreds of megabytes even on the
      # CPU build, and a cache of them is bigger than what it saves.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      # The wasm target, because `perturbation/` is the explorer's kernel too: the website
      # compiles it to `perturb.wasm` with SIMD and without, and `src/lanes.rs` exists only
      # in the SIMD build, so nothing native ever compiles or lints it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # `shell: bash` on every step that runs more than one command: Windows' default
      # PowerShell carries on past a failing native command, so only the last would count.
      - name: Rust format check
        shell: bash
        run: |
          cargo fmt --check --manifest-path engine/Cargo.toml
          cargo fmt --check --manifest-path perturbation/Cargo.toml

      # The engine twice: as `render-link` ships it, with the `deep` backend, and as the
      # website's `engine-wasm` takes it, with `default-features = false`.
      - name: Clippy
        shell: bash
        run: |
          cargo clippy --manifest-path engine/Cargo.toml -- -D warnings
          cargo clippy --manifest-path engine/Cargo.toml --no-default-features -- -D warnings
          cargo clippy --manifest-path perturbation/Cargo.toml --all-targets -- -D warnings

      # The kernel's two wasm builds, checked and linted as the website bakes them: plain
      # (`perturb-scalar.wasm`) and `+simd128` (`perturb.wasm`), each in its own target
      # directory so the two flag sets never invalidate each other.
      - name: Check the kernel for wasm32, scalar and simd128
        shell: bash
        run: |
          cargo clippy --manifest-path perturbation/Cargo.toml --release \
            --target wasm32-unknown-unknown -- -D warnings
          RUSTFLAGS="-C target-feature=+simd128" cargo clippy \
            --manifest-path perturbation/Cargo.toml --release \
            --target wasm32-unknown-unknown --target-dir perturbation/target/simd128 \
            -- -D warnings

      # BEFORE the Python suite, which is the whole point of this ordering.
      - name: Build the engine
        run: cargo build --release
        working-directory: engine

      # The crate's own tests, which the Python suite cannot reach: the escape
      # loop's channels, the resample kernel, the walk's gates and its focus
      # finder. Run after the build so a compile failure is reported as one.
      - name: Test the engine
        run: cargo test --release
        working-directory: engine

      # The kernel's own: its proofs against `f64` and a brute-force oracle, the
      # interior switch, and its pins. The pins are Windows bytes, held whole there and
      # by their counters elsewhere (`perturbation/tests/parity.rs`).
      - name: Test the deep kernel
        run: cargo test --release
        working-directory: perturbation

      # Exactly the README's line, and the default install: `models` is CPU torch
      # on every platform (PyTorch's CPU index on Linux, PyPI elsewhere), so no
      # runner downloads a CUDA wheel. The opt-in `cuda` extra is not exercised
      # here; a runner has no GPU to prove it on.
      - name: Install the package and all three extras
        run: uv sync --extra dev --extra models --extra solve

      # `--no-sync` on every `uv run`: a bare one syncs to the project's default
      # set first, which names no extras.
      - name: Lint
        run: uv run --no-sync python -m ruff check .

      - name: Format check
        run: uv run --no-sync python -m ruff format --check .

      # The full lane. `--slow` is what CI and a pre-checkpoint run give: the
      # default run holds back the renders, the training loops and the store
      # sweeps, which is right for an edit-run loop and wrong for a gate. `-rs`
      # so a skip is NAMED: zero skips is the normal reading on a machine with a
      # warm render cache, and a lane that quietly stopped running a file is the
      # failure this whole arrangement exists to catch. Through the checkout's
      # `.venv`, which `conftest` insists on wherever one exists.
      - name: Test
        run: uv run --no-sync python -m pytest --slow -rs
